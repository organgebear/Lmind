# Lmind 生产部署
# 只部署应用容器，连接服务器已有的 MySQL 和 Redis
# 用法：cp .env.example .env（填写实际值），然后：
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# 安全提示：
#   - 请勿在此文件中硬编码真实密码
#   - 将数据库和 Redis 密码填入 .env 文件（已在 .gitignore 中）
#   - .env 文件示例请参考 .env.example

services:
  lmind:
    image: lmind:latest
    container_name: lmind
    restart: always
    ports:
      - "24701:24701"
    env_file: .env
    volumes:
      - lmind_data:/app/data
    networks:
      - 1panel-network

volumes:
  lmind_data:

networks:
  1panel-network:
    external: true
